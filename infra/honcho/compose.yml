name: fabula-honcho

x-honcho-environment: &honcho-environment
  DB_CONNECTION_URI: postgresql+psycopg://fabula_honcho:fabula-honcho-local@database:5432/fabula_honcho
  CACHE_ENABLED: "true"
  CACHE_URL: redis://redis:6379/0?suppress=true
  LLM_OPENAI_API_KEY: ${NUXT_OPENROUTER_API_KEY:?Set NUXT_OPENROUTER_API_KEY in the repository .env file}

services:
  api:
    image: fabula-honcho:3.0.11-4d3ab1c
    entrypoint: ["sh", "docker/entrypoint.sh"]
    environment: *honcho-environment
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - storage
      - egress

  deriver:
    image: fabula-honcho:3.0.11-4d3ab1c
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment: *honcho-environment
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      api:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - storage
      - egress

  database:
    image: pgvector/pgvector:pg15
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: fabula_honcho
      POSTGRES_USER: fabula_honcho
      POSTGRES_PASSWORD: fabula-honcho-local
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabula_honcho -d fabula_honcho"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - storage

  redis:
    image: redis:8.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - storage

volumes:
  pgdata:
  redis-data:

networks:
  storage:
    internal: true
  egress:
